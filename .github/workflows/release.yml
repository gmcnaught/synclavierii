name: Release

# Releases the core the MiSTer-devel way: commits Synclavier_YYYYMMDD.rbf
# (the build date, which the OSD shows as vYYMMDD) to releases/ on main, in
# a commit named "Release YYYYMMDD." Distribution_MiSTer installs the newest
# releases/Synclavier_*.rbf and releases/*.mgl into _Computer/; older RBFs
# stay in releases/ as the version history. There are no GitHub Releases
# or tags.
#
# It does not compile: it takes the synclavier-rbf artifact of a
# successful Build RBF run on main (default: the latest), so the released
# file is the one CI built and timing-checked. The commit body names the
# run and the source commit (the RBF contains the GPL-2.0 MiSTer framework;
# that commit is its source). Artifacts expire after 90 days; rebuild with
# Build RBF (workflow_dispatch) for an older commit. One release per build
# date: the run fails when releases/ already has that file (remove it in a
# commit to replace it). tests/test_repo_hygiene.py allows .rbf files only
# at releases/Synclavier_YYYYMMDD.rbf.
#
# Run: Actions > Release > Run workflow (or `gh workflow run release.yml
# [-f run_id=N]`).

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Build RBF run id to release (blank = latest successful run on main)
        required: false
        default: ''

permissions:
  contents: write
  actions: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Commit release
    runs-on: ubuntu-latest
    steps:
      - name: Find the build
        id: build
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.inputs.run_id }}
        run: |
          set -euo pipefail
          if [ -z "$RUN_ID" ]; then
            RUN_ID=$(gh run list --workflow build-rbf.yml --branch main --status success --limit 20 \
                       --json databaseId,event \
                       --jq '[.[] | select(.event == "push" or .event == "workflow_dispatch")][0].databaseId // empty')
          fi
          case "$RUN_ID" in ''|*[!0-9]*) echo "::error::no Build RBF run (run_id='$RUN_ID')"; exit 1;; esac
          gh run view "$RUN_ID" --json workflowName,event,headBranch,conclusion,headSha,url > run.json
          cat run.json
          # push / workflow_dispatch only: a fork's pull request can come from a branch named main
          jq -e '.workflowName == "Build RBF" and .headBranch == "main" and .conclusion == "success"
                 and (.event == "push" or .event == "workflow_dispatch")' run.json >/dev/null ||
            { echo "::error::run $RUN_ID is not a successful Build RBF run on main"; exit 1; }
          {
            echo "run_id=$RUN_ID"
            echo "sha=$(jq -r .headSha run.json)"
            echo "url=$(jq -r .url run.json)"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Commit the RBF to releases/
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ steps.build.outputs.run_id }}
          RUN_URL: ${{ steps.build.outputs.url }}
          SHA: ${{ steps.build.outputs.sha }}
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$SHA" origin/main ||
            { echo "::error::$SHA is not on main"; exit 1; }
          gh run download "$RUN_ID" -n synclavier-rbf -D rbf
          ls -l rbf
          mapfile -t rbfs < <(find rbf -name '*.rbf')
          [ "${#rbfs[@]}" -eq 1 ] || { echo "::error::expected one RBF, found ${#rbfs[@]}"; exit 1; }
          name=$(basename "${rbfs[0]}")
          [[ "$name" =~ ^Synclavier_[0-9]{8}\.rbf$ ]] || { echo "::error::RBF name $name is not Synclavier_YYYYMMDD.rbf"; exit 1; }
          [ ! -e "releases/$name" ] ||
            { echo "::error::releases/$name exists: one release per build date (remove it to replace it)"; exit 1; }
          version=${name#Synclavier_}; version=${version%.rbf}
          cp "${rbfs[0]}" "releases/$name"
          sha256sum "releases/$name"
          python3 tests/test_repo_hygiene.py
          python3 tests/test_mgl.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "releases/$name"
          git commit -q -F - <<EOF
          Release $version.

          Built by Build RBF run $RUN_ID ($RUN_URL)
          from $SHA.
          EOF
          git show --stat HEAD
          # main may have moved since checkout: rebase the one-file commit and retry
          for _ in 1 2 3; do
            git push origin HEAD:main && exit 0
            git pull -q --rebase origin main
          done
          echo "::error::push to main failed"; exit 1
