name: Build RBF

# Compiles the MiSTer core (mister/Synclavier.qpf) with Quartus Lite 17.0 in
# the raetro/quartus:17.0 Docker image: on the self-hosted TrueNAS runner
# (label `quartus`, mister/ci/truenas-runner.yaml) when the repository
# variable QUARTUS_RUNNER is `truenas`, otherwise on ubuntu-latest. Runs on pull requests and pushes to main that touch the HDL or
# the MiSTer project, and on demand. The RBF and the Quartus reports are
# uploaded as artifacts; mister/build.sh fails the job on a failed compile
# or negative slack (after the reports are saved).
#
# workflow_dispatch is only listed once this file is on the default branch.

on:
  workflow_dispatch:
    inputs:
      seed:
        description: Fitter seed override (integer; blank = the QSF's)
        required: false
        default: ''
  pull_request:
    paths:
      - 'hdl/**'
      - '!hdl/sim/**'
      - 'mister/**'
      - '.github/workflows/build-rbf.yml'
  push:
    branches: [main]
    paths:
      - 'hdl/**'
      - '!hdl/sim/**'
      - 'mister/**'
      - '.github/workflows/build-rbf.yml'

concurrency:
  group: build-rbf-${{ github.ref }}-${{ github.event.inputs.seed || 'qsf' }}
  cancel-in-progress: true

jobs:
  rbf:
    name: RBF (Quartus Lite 17.0)
    runs-on: ${{ vars.QUARTUS_RUNNER == 'truenas' && fromJSON('["self-hosted", "quartus"]') || 'ubuntu-latest' }}
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space (Quartus needs ~24 GB)
        if: ${{ vars.QUARTUS_RUNNER != 'truenas' }}
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: true

      # The sources go into the container and the results come back as tar
      # streams (no bind mount), so the runner's work path need not exist on
      # the Docker host (the TrueNAS runner uses the host's Docker).
      # Non-login `bash -c`: the image's entrypoint puts Quartus on PATH; a
      # login shell re-reads /etc/profile and loses it.
      - name: Compile
        id: compile
        shell: bash
        env:
          SYNCLAVIER_SEED: ${{ github.event.inputs.seed }}
        run: |
          set -o pipefail
          tar -cf - --exclude=./.git . |
            docker run --rm -i -e SYNCLAVIER_SEED raetro/quartus:17.0 bash -c '
              mkdir -p /build && cd /build && tar -xf - || exit 2
              mister/build.sh _out 1>&2; status=$?
              tar -cf - mister/_out mister/output_files mister/build.log 2>/dev/null
              exit $status' |
            tar -xf -

      - name: Upload Quartus reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quartus-reports
          path: |
            mister/output_files/*.rpt
            mister/output_files/*.summary
            mister/output_files/worst_paths*.txt
            mister/output_files/core_*.txt
            mister/output_files/sta_paths.log
            mister/build.log
          if-no-files-found: warn

      - name: Upload RBF
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: synclavier-rbf
          path: mister/_out/*.rbf
          if-no-files-found: warn
