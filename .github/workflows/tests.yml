name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Verilator (HDL lockstep tests)
        run: sudo apt-get update && sudo apt-get install -y verilator && verilator --version
      - name: Run tests (stdlib only; HDL tests use Verilator)
        run: |
          set -e
          for t in tests/test_*.py tests/*/test_*.py; do
            echo "== $t"
            python "$t"
          done
